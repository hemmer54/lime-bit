[package]
name = "lime-bit"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# BitTorrent Engine & Protocol
gosh-dl = { git = "https://github.com/goshitsarch-eng/gosh-dl", branch = "main" }

# UI & Rendering Framework (Bundles GPUI automatically)
gpui-kit = "0.6.1"
# Text input controls used by the GPUI client shell
gpui-component = "0.6.1"
# Native file picker with extension filters
rfd = "0.15.4"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging & Error Handling
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
